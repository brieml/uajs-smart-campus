# =============================================================
# UAJS Smart Campus - Entorno de desarrollo con Docker
#
# Levanta el servidor de desarrollo de Vite con recarga en caliente,
# montando el código fuente como volumen para reflejar los cambios
# sin reconstruir la imagen.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up
# =============================================================
services:
  frontend-dev:
    image: node:20-alpine
    container_name: uajs-smart-campus-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_MOCK_API=true

volumes:
  frontend_node_modules:
