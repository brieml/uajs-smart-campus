# Configuración de Nginx para servir la SPA de React (Vite build)
# y delegar el enrutamiento del lado del cliente a React Router.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para mejorar tiempos de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;

    # Cachear assets estáticos con hash en el nombre de archivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo existente
    # se resuelve contra index.html para que React Router la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar la versión de Nginx en las cabeceras de respuesta
    server_tokens off;
}
